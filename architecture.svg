<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="cliGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009485;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00695f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sharedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC382D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a02820;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="llmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <text x="500" y="35" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">AI CLI Chatbot Architecture</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">Single codebase, dual interfaces — CLI tool + Production REST API</text>
  
  <g>
    <rect x="80" y="90" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="118" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">🖥️ Developer</text>
    <text x="180" y="138" font-size="11" fill="#64748b" text-anchor="middle">Terminal / SSH</text>
    <text x="180" y="153" font-size="11" fill="#64748b" text-anchor="middle">Local CLI usage</text>
  </g>
  
  <g>
    <rect x="720" y="90" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="820" y="118" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">🌐 API Clients</text>
    <text x="820" y="138" font-size="11" fill="#64748b" text-anchor="middle">Web / Mobile / Bot</text>
    <text x="820" y="153" font-size="11" fill="#64748b" text-anchor="middle">HTTPS + SSE</text>
  </g>
  
  <line x1="180" y1="160" x2="180" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="160" x2="820" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g>
    <rect x="80" y="210" width="200" height="120" rx="12" fill="url(#cliGradient)" stroke="#065f46" stroke-width="2"/>
    <text x="180" y="240" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">CLI Interface</text>
    <text x="180" y="260" font-size="11" fill="#d1fae5" text-anchor="middle">main.py</text>
    <line x1="100" y1="270" x2="260" y2="270" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="180" y="288" font-size="11" fill="#ecfdf5" text-anchor="middle">Interactive commands</text>
    <text x="180" y="304" font-size="11" fill="#ecfdf5" text-anchor="middle">Session save/load</text>
    <text x="180" y="320" font-size="11" fill="#ecfdf5" text-anchor="middle">Terminal streaming</text>
  </g>
  
  <g>
    <rect x="720" y="210" width="200" height="120" rx="12" fill="url(#apiGradient)" stroke="#065f56" stroke-width="2"/>
    <text x="820" y="240" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">API Interface</text>
    <text x="820" y="260" font-size="11" fill="#a7f3d0" text-anchor="middle">api.py (FastAPI)</text>
    <line x1="740" y1="270" x2="900" y2="270" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="820" y="288" font-size="11" fill="#e0f2f1" text-anchor="middle">Auth + Rate Limiting</text>
    <text x="820" y="304" font-size="11" fill="#e0f2f1" text-anchor="middle">SSE Streaming</text>
    <text x="820" y="320" font-size="11" fill="#e0f2f1" text-anchor="middle">OpenAPI docs</text>
  </g>
  
  <line x1="280" y1="270" x2="330" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="270" x2="670" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g>
    <rect x="200" y="360" width="600" height="130" rx="12" fill="url(#sharedGradient)" stroke="#92400e" stroke-width="2"/>
    <text x="500" y="390" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Shared Business Logic</text>
    <text x="500" y="408" font-size="11" fill="#fef3c7" text-anchor="middle">Both interfaces reuse these modules</text>
    
    <rect x="220" y="420" width="130" height="55" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)"/>
    <text x="285" y="440" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">router.py</text>
    <text x="285" y="458" font-size="10" fill="#fef3c7" text-anchor="middle">Smart model</text>
    <text x="285" y="470" font-size="10" fill="#fef3c7" text-anchor="middle">selection</text>
    
    <rect x="360" y="420" width="130" height="55" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)"/>
    <text x="425" y="440" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">modes.py</text>
    <text x="425" y="458" font-size="10" fill="#fef3c7" text-anchor="middle">System prompts</text>
    <text x="425" y="470" font-size="10" fill="#fef3c7" text-anchor="middle">Per mode</text>
    
    <rect x="500" y="420" width="130" height="55" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)"/>
    <text x="565" y="440" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">cost_tracker.py</text>
    <text x="565" y="458" font-size="10" fill="#fef3c7" text-anchor="middle">Token counting</text>
    <text x="565" y="470" font-size="10" fill="#fef3c7" text-anchor="middle">Cost calculation</text>
    
    <rect x="640" y="420" width="140" height="55" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)"/>
    <text x="710" y="440" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">prompt_registry</text>
    <text x="710" y="458" font-size="10" fill="#fef3c7" text-anchor="middle">Templated</text>
    <text x="710" y="470" font-size="10" fill="#fef3c7" text-anchor="middle">prompts</text>
  </g>
  
  <line x1="280" y1="490" x2="180" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="490" x2="500" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="490" x2="820" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g>
    <rect x="60" y="570" width="240" height="130" rx="12" fill="url(#dbGradient)" stroke="#1e3a5f" stroke-width="2"/>
    <text x="180" y="600" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL 16</text>
    <text x="180" y="618" font-size="11" fill="#c7d2fe" text-anchor="middle">Durable Storage</text>
    <line x1="80" y1="628" x2="280" y2="628" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="180" y="648" font-size="11" fill="#e0e7ff" text-anchor="middle">Users · API Keys</text>
    <text x="180" y="664" font-size="11" fill="#e0e7ff" text-anchor="middle">Conversations · Messages</text>
    <text x="180" y="680" font-size="11" fill="#e0e7ff" text-anchor="middle">Alembic migrations</text>
  </g>
  
  <g>
    <rect x="380" y="570" width="240" height="130" rx="12" fill="url(#redisGradient)" stroke="#7f1d1d" stroke-width="2"/>
    <text x="500" y="600" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Redis 7</text>
    <text x="500" y="618" font-size="11" fill="#fecaca" text-anchor="middle">Cache + Rate Limiter</text>
    <line x1="400" y1="628" x2="600" y2="628" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="500" y="648" font-size="11" fill="#fee2e2" text-anchor="middle">Sliding Window Rate Limits</text>
    <text x="500" y="664" font-size="11" fill="#fee2e2" text-anchor="middle">Session Cache (5min TTL)</text>
    <text x="500" y="680" font-size="11" fill="#fee2e2" text-anchor="middle">Multi-Worker Safe</text>
  </g>
  
  <g>
    <rect x="700" y="570" width="240" height="130" rx="12" fill="url(#llmGradient)" stroke="#5b21b6" stroke-width="2"/>
    <text x="820" y="600" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">OpenRouter</text>
    <text x="820" y="618" font-size="11" fill="#ddd6fe" text-anchor="middle">LLM Gateway</text>
    <line x1="720" y1="628" x2="920" y2="628" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="820" y="648" font-size="11" fill="#ede9fe" text-anchor="middle">GPT-4o-mini · Nemotron</text>
    <text x="820" y="664" font-size="11" fill="#ede9fe" text-anchor="middle">Gemma · Claude</text>
    <text x="820" y="680" font-size="11" fill="#ede9fe" text-anchor="middle">Streaming support</text>
  </g>
</svg>
